<?xml version="1.0" encoding="UTF-8"?>
<svg width="1150" height="1600" viewBox="0 0 1150 1600" xmlns="http://www.w3.org/2000/svg" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <style>
    .box {
      fill: #ffffff;
      stroke: #94a3b8;
      stroke-width: 2;
    }
    .diamond {
      fill: #ffffff;
      stroke: #94a3b8;
      stroke-width: 2;
    }
    .txt {
      fill: #334155;
      font-size: 14px;
      font-weight: 500;
      text-anchor: middle;
    }
    .line {
      fill: none;
      stroke: #3b82f6; /* Blue arrows matching the image */
      stroke-width: 2;
    }
    .label-bg {
      fill: #ffffff;
      stroke: #e2e8f0;
      stroke-width: 1;
      rx: 3;
    }
    .label-txt {
      fill: #64748b;
      font-size: 11px;
      font-weight: 600;
      text-anchor: middle;
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3b82f6" />
    </marker>
  </defs>

  <!-- ================= LINES & ARROWS ================= -->
  
  <!-- Central Trunk -->
  <path class="line" d="M 500 100 L 500 135" marker-end="url(#arrow)" />
  <path class="line" d="M 500 190 L 500 225" marker-end="url(#arrow)" />
  <path class="line" d="M 500 280 L 500 315" marker-end="url(#arrow)" />
  <path class="line" d="M 500 370 L 500 405" marker-end="url(#arrow)" />
  <path class="line" d="M 500 460 L 500 495" marker-end="url(#arrow)" />
  
  <!-- D1 Branch (Confidence) -->
  <path class="line" d="M 620 560 L 750 560 L 750 645" marker-end="url(#arrow)" /> <!-- NO -->
  <path class="line" d="M 380 560 L 250 560 L 250 1065" marker-end="url(#arrow)" /> <!-- YES -->
  
  <!-- Right Branch Trunk -->
  <path class="line" d="M 750 700 L 750 735" marker-end="url(#arrow)" />
  <path class="line" d="M 750 790 L 750 825" marker-end="url(#arrow)" />
  <path class="line" d="M 750 880 L 750 915" marker-end="url(#arrow)" />
  
  <!-- D2 Branch (Validation) -->
  <path class="line" d="M 630 980 L 500 980 L 500 1065" marker-end="url(#arrow)" /> <!-- YES -->
  <path class="line" d="M 870 980 L 950 980 L 950 1065" marker-end="url(#arrow)" /> <!-- NO -->

  <!-- Loop back from Reject to Verification Queue -->
  <path class="line" d="M 950 1120 L 1020 1120 L 1020 675 L 875 675" marker-end="url(#arrow)" />
  
  <!-- Merge back to Central Trunk -->
  <path class="line" d="M 500 1120 L 500 1155" marker-end="url(#arrow)" />
  <path class="line" d="M 250 1120 L 250 1140 L 500 1140" />
  
  <!-- Bottom Central Trunk -->
  <path class="line" d="M 500 1210 L 500 1245" marker-end="url(#arrow)" />
  <path class="line" d="M 500 1300 L 500 1335" marker-end="url(#arrow)" />
  <path class="line" d="M 500 1390 L 500 1425" marker-end="url(#arrow)" />
  <path class="line" d="M 500 1480 L 500 1515" marker-end="url(#arrow)" />

  <!-- ================= YES/NO LABELS ================= -->
  <!-- D1 No -->
  <rect x="670" y="550" width="30" height="20" class="label-bg" />
  <text x="685" y="564" class="label-txt">No</text>
  
  <!-- D1 Yes -->
  <rect x="300" y="550" width="30" height="20" class="label-bg" />
  <text x="315" y="564" class="label-txt">Yes</text>

  <!-- D2 Yes -->
  <rect x="550" y="970" width="30" height="20" class="label-bg" />
  <text x="565" y="984" class="label-txt">Yes</text>
  
  <!-- D2 No -->
  <rect x="895" y="970" width="30" height="20" class="label-bg" />
  <text x="910" y="984" class="label-txt">No</text>

  <!-- ================= NODES ================= -->

  <!-- N1 -->
  <rect x="380" y="50" width="240" height="50" rx="2" class="box" />
  <text x="500" y="80" class="txt">Login / Demo Mode</text>

  <!-- N2 -->
  <rect x="380" y="140" width="240" height="50" rx="2" class="box" />
  <text x="500" y="170" class="txt">Upload Drone Orthomosaic</text>

  <!-- N3 -->
  <rect x="380" y="230" width="240" height="50" rx="2" class="box" />
  <text x="500" y="260" class="txt">AI Feature Extraction</text>

  <!-- N4 -->
  <rect x="380" y="320" width="240" height="50" rx="2" class="box" />
  <text x="500" y="350" class="txt">Generate Candidate Parcels</text>

  <!-- N5 -->
  <rect x="380" y="410" width="240" height="50" rx="2" class="box" />
  <text x="500" y="440" class="txt">Assign Confidence Scores</text>

  <!-- D1 -->
  <polygon points="500,500 620,560 500,620 380,560" class="diamond" />
  <text x="500" y="565" class="txt">Confidence ≥ Threshold?</text>

  <!-- N6 (Queue) -->
  <rect x="630" y="650" width="240" height="50" rx="2" class="box" />
  <text x="750" y="680" class="txt">Add to Verification Queue</text>

  <!-- N7 (Review) -->
  <rect x="630" y="740" width="240" height="50" rx="2" class="box" />
  <text x="750" y="770" class="txt">Human Review &amp; Edit</text>

  <!-- N8 (Check) -->
  <rect x="630" y="830" width="240" height="50" rx="2" class="box" />
  <text x="750" y="860" class="txt">Validation Rules Check</text>

  <!-- D2 -->
  <polygon points="750,920 870,980 750,1040 630,980" class="diamond" />
  <text x="750" y="985" class="txt">Validation Passed?</text>

  <!-- N9 (Reject) -->
  <rect x="830" y="1070" width="240" height="50" rx="2" class="box" />
  <text x="950" y="1100" class="txt">Reject / Re-process</text>

  <!-- N10 (Approve) -->
  <rect x="380" y="1070" width="240" height="50" rx="2" class="box" />
  <text x="500" y="1100" class="txt">Approve Parcel</text>

  <!-- N11 (Auto-accept) -->
  <rect x="130" y="1070" width="240" height="50" rx="2" class="box" />
  <text x="250" y="1100" class="txt">Auto-accept Parcel</text>

  <!-- N12 (Temporal) -->
  <rect x="380" y="1160" width="240" height="50" rx="2" class="box" />
  <text x="500" y="1190" class="txt">Temporal Change Detection</text>

  <!-- N13 (Swipe) -->
  <rect x="380" y="1250" width="240" height="50" rx="2" class="box" />
  <text x="500" y="1280" class="txt">Swipe-Map Visualization</text>

  <!-- N14 (Export) -->
  <rect x="380" y="1340" width="240" height="50" rx="2" class="box" />
  <text x="500" y="1370" class="txt">Export GIS Formats</text>

  <!-- N15 (Audit) -->
  <rect x="380" y="1430" width="240" height="50" rx="2" class="box" />
  <text x="500" y="1460" class="txt">Generate Audit Report</text>

  <!-- N16 (End) -->
  <rect x="440" y="1520" width="120" height="40" rx="2" class="box" />
  <text x="500" y="1545" class="txt">End</text>

</svg>
